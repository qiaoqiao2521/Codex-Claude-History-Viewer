<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentTraceMesh</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="reader-page">
  <div id="app">
    <aside id="sidebar">
      <div id="sidebarTop" class="sidebar-top">
        <div class="reader-brand"><a href="/" class="brand-title">AgentTraceMesh</a><div class="reader-brand-actions"><button type="button" class="btn small" id="readerToggleList" aria-expanded="true" aria-controls="readerProject sessionList">会话目录</button><button type="button" class="btn small" id="readerSettings" data-open-settings>设置</button></div></div>
        <nav class="reader-nav" aria-label="主导航"><a href="/">选择项目</a><a href="/?view=search">搜索历史</a></nav>
        <div class="reader-project-control"><label for="readerProject">当前项目</label><select id="readerProject"><option value="__choose_project__" disabled selected>选择项目…</option></select><button type="button" class="btn small" id="readerProjectsMore" hidden>更多项目</button></div>
        <div class="reader-source-control"><label for="readerSource">会话来源</label><select id="readerSource"><option value="">全部来源</option></select></div>
        <p id="readerListStatus" class="muted" role="status" aria-live="polite"></p>
        <div hidden aria-hidden="true">
          <div id="systemTabs"></div><div id="sourceTabs"></div>
          <button type="button" data-view="sessions">Sessions</button><button type="button" data-view="projects">Projects</button>
          <div id="projectCrumb"></div><button id="backToProjects" type="button">Back to projects</button><button id="deleteProjectSessions" type="button">Delete project chats</button>
          <form id="searchForm"><input id="q" type="text"><input id="start" type="text"><input id="end" type="text"></form>
        </div>
      </div>
      <div id="sidebarSessionsResizer" hidden></div>

      <div class="results">
        <div class="results-header">
          <div class="results-title">
            <div id="resultsLabel" class="label">对话</div>
            <div id="resultCount" class="muted">0</div>
          </div>
          <div id="sessionSortWrap" class="session-sort-wrap">
            <select id="sessionSort" class="session-sort" aria-label="对话排序" title="对话排序">
              <option value="start">开始时间</option>
              <option value="last">最近活动</option>
              <option value="value">价值信号</option>
            </select>
          </div>
        </div>
        <div class="reader-group-toolbar"><button id="readerGroupRelated" type="button" class="btn small" aria-pressed="true" aria-controls="sessionList">归组相关会话</button></div>
        <div id="fileFilterBanner" class="file-filter-banner" hidden>
          <span class="file-filter-label">Filter:</span>
          <span class="file-filter-path" data-file-filter-label title="Sessions touching this path"></span>
          <button type="button" id="clearFileFilter" class="btn small" aria-label="Clear file filter">✕</button>
        </div>
        <div id="sessionList" class="session-list"></div>
        <div id="listFooter" class="list-footer">
          <button type="button" id="listLoadMore" class="btn small" style="display:none">更多对话</button>
        </div>
      </div>
    </aside>

    <div id="sidebarResizer" class="resizer vertical" title="Resize sidebar" aria-label="Resize sidebar"></div>

    <main id="main">
      <div id="sessionHeader" class="session-header">
        <div class="reader-session-heading"><div class="session-title">选择项目，开始阅读</div><div class="reader-heading-actions"><button id="toggleKeyMessages" type="button" class="btn small" aria-expanded="false" aria-controls="keyMessagesPanel" disabled>关键消息</button><button id="toggleConversationFind" type="button" class="btn small" aria-expanded="false" aria-controls="conversationFind">查找对话内容</button></div></div>
        <div class="session-meta muted"></div>
        <div id="historyTarget" class="muted" role="status" hidden></div>
        <details id="sessionDetails" class="reader-details"><summary>会话信息与续接</summary>
        <div class="session-info">
          <div class="info-row">
            <div class="info-label">工作目录</div>
            <div id="workdirValue" class="info-value muted">-</div>
            <button id="copyWorkdir" type="button" class="btn small">复制</button>
          </div>
          <div class="info-row">
            <div class="info-label">会话 ID</div>
            <div id="resumeValue" class="info-value muted">-</div>
            <button id="copyResumeId" type="button" class="btn small">复制</button>
          </div>
          <div class="info-row">
            <div id="resumeCmdPrimaryLabel" class="info-label">Resume PS</div>
            <div id="resumeCmdPs" class="info-value code">-</div>
            <button id="copyResumeCmdPs" type="button" class="btn small">复制</button>
          </div>
          <div class="info-row">
            <div id="resumeCmdSecondaryLabel" class="info-label">Resume WSL</div>
            <div id="resumeCmdWsl" class="info-value code">-</div>
            <button id="copyResumeCmdWsl" type="button" class="btn small">复制</button>
          </div>
        </div>
        </details>
        <div id="conversationFind" class="session-search" hidden>
          <input id="sessionSearch" type="text" placeholder="仅查找当前对话" aria-label="查找当前对话" />
          <div id="sessionSearchCount" class="muted"></div>
          <button id="prevMatch" type="button" class="btn small" title="Previous match" aria-label="Previous match">▲</button>
          <button id="nextMatch" type="button" class="btn small" title="Next match" aria-label="Next match">▼</button>
          <button id="clearSessionSearch" type="button" class="btn small">清除</button>

        </div>
        <div id="sessionActions" class="session-actions" style="display:none">
          <button id="pinSession" type="button" class="btn small">📌 Pin</button>
          <button id="renameSession" type="button" class="btn small">✏️ Rename</button>
          <button id="archiveSession" type="button" class="btn small danger">🗑️ Archive</button>
        </div>
        <details id="sessionReview" class="reader-details"><summary>审计、交接与用量</summary>
        <div id="auditActions" class="session-actions audit-actions" style="display:none">
          <button id="auditToggle" type="button" class="btn small" aria-expanded="true" aria-controls="auditPanel">📊 Hide audit</button>
          <select id="handoffDetail" class="handoff-detail" aria-label="Handoff detail">
            <option value="compact">Compact</option>
            <option value="standard" selected>Standard</option>
          </select>
          <button id="copyHandoff" type="button" class="btn small" title="Copy agent handoff" aria-label="Copy agent handoff">📋 Handoff</button>
          <button id="handoffPreviewBtn" type="button" class="btn small" aria-expanded="false" aria-controls="handoffPanel" title="Render a themed handoff preview">👁 Preview</button>
          <button id="copyHandoffRich" type="button" class="btn small" title="Copy the handoff as rich text (HTML + plain)">📋 Rich</button>
          <button id="downloadHandoffMd" type="button" class="btn small" title="Download handoff as Markdown">⬇ .md</button>
          <button id="downloadHandoffHtml" type="button" class="btn small" title="Download handoff as themed HTML">⬇ .html</button>
          <button id="auditGenerate" type="button" class="btn small" hidden aria-label="Generate AI audit">🤖 Generate Audit</button>
          <button id="auditDelete" type="button" class="btn small danger" hidden aria-label="Delete AI audit">🗑️ Delete Audit</button>
        </div>
        <div id="insightActions" class="session-actions insight-actions" style="display:none">
          <span class="tool-actions-label muted">Insights:</span>
          <button id="usageToggle" type="button" class="btn small" aria-expanded="false" aria-controls="usagePanel" title="Token usage across sessions in this source">⚡ Usage</button>
          <button id="briefingToggle" type="button" class="btn small" aria-expanded="false" aria-controls="briefingPanel" title="Daily work briefing for this source">📰 Briefing</button>
          <button id="planToggle" type="button" class="btn small" aria-expanded="false" aria-controls="planPanel" title="Planning files near this session">🗒 Plans</button>
        </div>
        <div id="toolActions" class="session-actions tool-actions" style="display:none">
          <span class="tool-actions-label muted">Tools:</span>
          <button id="expandAllTools" type="button" class="btn small" title="Expand all tool blocks">▸ Expand all</button>
          <button id="collapseAllTools" type="button" class="btn small" title="Collapse all tool blocks">▾ Collapse all</button>
        </div>
        <section id="auditPanel" class="audit-panel" hidden aria-live="polite"></section>
        <section id="handoffPanel" class="insight-panel handoff-panel" hidden aria-live="polite">
          <div class="panel-toolbar">
            <span class="label">Handoff preview</span>
            <select id="handoffTheme" class="handoff-theme" aria-label="Handoff theme">
              <option value="plain" selected>Plain</option>
              <option value="card">Card</option>
              <option value="feishu">Feishu card</option>
            </select>
          </div>
          <div id="handoffPreviewBody" class="handoff-body handoff-theme-plain"></div>
        </section>
        <section id="usagePanel" class="insight-panel" hidden aria-live="polite">
          <div class="panel-toolbar">
            <span class="label">Token usage</span>
            <select id="usageRange" class="usage-range" aria-label="Usage range">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="0">All time</option>
            </select>
            <span id="usageSummary" class="muted"></span>
          </div>
          <div id="usageContent"></div>
        </section>
        <section id="briefingPanel" class="insight-panel" hidden aria-live="polite">
          <div class="panel-toolbar">
            <span class="label">Daily briefing</span>
            <input id="briefingDate" type="text" class="briefing-date" placeholder="YYYY-MM-DD" inputmode="numeric" />
            <button id="briefingRefresh" type="button" class="btn small">Refresh</button>
            <button id="briefingNarrative" type="button" class="btn small" title="Generate a narrative (LLM when configured, heuristic otherwise)">🤖 Narrative</button>
            <button id="copyBriefingMd" type="button" class="btn small" title="Copy the briefing as Markdown">📋 Copy MD</button>
          </div>
          <div id="briefingNarrativeBox" class="briefing-narrative" hidden></div>
          <div id="briefingContent"></div>
        </section>
        <section id="planPanel" class="insight-panel" hidden aria-live="polite">
          <div class="panel-toolbar">
            <span class="label">Planning files near this session</span>
            <span class="muted">read-only</span>
          </div>
          <div id="planContent"></div>
        </section>
        </details>
      </div>
      <section id="keyMessagesPanel" class="key-messages-panel" aria-label="关键消息导航" hidden>
        <p class="muted">自动标记只供定位，以原文为准；最后回复不代表任务已完成。</p>
        <p id="keyMessagesStatus" class="muted" role="status" aria-live="polite"></p>
        <ol id="keyMessagesList" class="key-messages-list"></ol>
      </section>
      <div id="headerResizer" hidden></div>
      <div id="transcriptArea" class="transcript-area">
        <div id="toolTimeline" class="tool-timeline" hidden aria-label="Tool call timeline"></div>
        <div id="messages" class="messages"></div>
      </div>
      <button type="button" id="scrollBottomBtn" class="scroll-bottom-btn" aria-label="Scroll to bottom" title="跳到底部" hidden>↓</button>
    </main>
  </div>

  <script src="/settings.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
